# Example DOD — replace with your project's real definition of done.
# Every check is deterministic: file stats, greps, exit codes. The cage
# refuses a DOD with zero criteria.

task: "example — describe the task this DOD gates"
name: "example"
description: >
  Template contract. Each criterion groups deterministic checks; all
  checks must pass for verify to exit 0.

criteria:
  - name: "project documents itself"
    verify:
      - type: exists
        file: "README.md"
      - type: lines
        file: "README.md"
        min: 5

  - name: "tests pass"
    verify:
      - type: command
        run: "true # replace with your test command"
        expect_exit: 0

  - name: "lint is clean (ruff)"
    verify:
      # Runs ruff's default ruleset (real bugs, not style nitpicks). Skips
      # gracefully if ruff is not installed — never fail on a missing tool.
      - type: command
        run: "if command -v ruff >/dev/null 2>&1; then ruff check .; else echo 'ruff not installed — skipping'; fi"
        expect_exit: 0

  # Opt-in, per project — type checking is stricter and can over-burden the
  # worker (it chases annotations). Uncomment only where you want it enforced:
  # - name: "types check (mypy)"
  #   verify:
  #     - type: command
  #       run: "if command -v mypy >/dev/null 2>&1; then mypy .; else echo 'mypy not installed — skipping'; fi"
  #       expect_exit: 0

