backend:
  type: llama_cpp
  params:
    base_url: "http://127.0.0.1:8080"
    model: "local"
    max_context: "32768"
dod: ".cage/dods/plan-stage.yaml"
jail:
  root: "."
budget:
  max_tokens: 24000
  prompt_ceiling: 8000
memory:
  enabled: false
  path: ".cage/memories.jsonl"
quality:
  disable: []
cooldown_seconds: 10
worker:
  mode: ralph
  max_turns: 24
  attempt_seconds: 900
  max_gen_tokens: 8192
  temperature: 0.6
