task: "wire the mypy critic into cage run's post-pass flow as a toggleable plugin"
name: "module2b-critic-wired"
description: >
  After a run's DOD passes, when the critic is enabled, cage run must invoke the
  critic on touched .py files. Prove it with a deterministic test (mypy is
  deterministic) that the critic fires on a fixture with type errors, respects
  MaxRounds, and enforces the allowlist. Disabled = unchanged behavior.
criteria:
  - name: "builds, vets, tests"
    verify:
      - type: command
        run: "go build ./..."
        expect_exit: 0
      - type: command
        run: "go vet ./..."
        expect_exit: 0
      - type: command
        run: "go test ./..."
        expect_exit: 0
  - name: "the run flow references the critic package (actually wired)"
    verify:
      - type: grep
        file: "cmd/run.go"
        regex: "internal/critic|critic\\.|Critic|Mypy"
  - name: "a behavioral test exercises the critic firing + bounds"
    verify:
      - type: command
        run: "grep -rlE 'critic|Critic|Mypy' cmd/*_test.go internal/critic/*_test.go 2>/dev/null | xargs -r grep -lE 'Round|Bounded|allowlist|Allow' | grep -q ."
        expect_exit: 0
  - name: "still a plug: critic disabled by default"
    verify:
      - type: grep
        file: "internal/config/config.go"
        regex: "Mypy|Critic"
  - name: "version bumped"
    verify:
      - type: command
        run: "test \"$(cat .ai/VERSION)\" != \"1.3.1\""
        expect_exit: 0
